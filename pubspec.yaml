name: diagnostic
description: AmL Diagnostic — Android ANR and performance diagnostic tool
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  aml_ui:
    path: ../global-assets/packages/aml_ui
  archive: ^4.0.7
  collection: ^1.19.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.0.0
  http: ^1.5.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/branding/app_icon_light.png"
  windows:
    generate: true
    image_path: "assets/branding/app_icon_light.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
